<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fetih Sosyal</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    html, body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%) fixed;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
    }
    
    .container { 
      width: 100%; 
      max-width: 480px; 
      background: rgba(30, 41, 59, 0.85); 
      backdrop-filter: blur(16px); 
      -webkit-backdrop-filter: blur(16px); 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      border-radius: 20px; 
      padding: 30px 20px; 
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); 
      margin-bottom: 30px;
    }

    .brand-header { text-align: center; margin-bottom: 24px; }
    .brand-header h1 { font-size: 28px; font-weight: 700; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
    .brand-header p { color: #94a3b8; font-size: 13px; }

    .input-group { position: relative; margin-bottom: 14px; width: 100%; }
    .input-group i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 15px; }
    .input-group input, .input-group textarea { width: 100%; padding: 12px 14px 12px 46px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #fff; font-size: 14px; outline: none; transition: all 0.3s ease; }
    .input-group textarea { padding-left: 14px; resize: none; height: 80px; }
    .input-group input:focus, .input-group textarea:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }

    .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%); border: none; border-radius: 12px; color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; margin-top: 6px; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3); }

    .toggle-text { text-align: center; margin-top: 20px; font-size: 13px; color: #94a3b8; }
    .toggle-text span { color: #38bdf8; font-weight: 600; cursor: pointer; }
    .toggle-text span:hover { text-decoration: underline; }

    /* Akış ve Profil */
    .feed-container { max-width: 540px; width: 100%; padding: 20px 16px 80px 16px; position: relative; }
    .feed-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .logout-btn { width: auto; padding: 6px 12px; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #f87171; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
    
    .post-card { background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; padding: 14px; margin-top: 14px; }
    .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .user-avatar { width: 34px; height: 34px; background: #6366f1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
    .post-card strong { color: #38bdf8; font-size: 14px; }
    .post-card p { color: #e2e8f0; font-size: 13px; line-height: 1.4; word-break: break-word; margin-bottom: 8px; }
    .post-media { width: 100%; border-radius: 10px; max-height: 300px; object-fit: cover; margin-top: 6px; }
    .post-video { width: 100%; border-radius: 10px; max-height: 300px; margin-top: 6px; outline: none; }
    .post-time { color: #64748b; font-size: 10px; margin-top: 6px; display: block; text-align: right; }

    /* --- INSTA TARZI KAMERA / MEDYA EKRANI (MODAL) --- */
    #camera-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #000;
      z-index: 9999;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .camera-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      font-size: 20px;
    }
    .camera-top-bar button {
      background: none; border: none; color: white; font-size: 22px; cursor: pointer;
    }
    .camera-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      margin: 10px 0;
      background: #111;
    }
    #cameraStream {
      width: 100%; height: 100%; object-fit: cover;
    }
    #previewImageCaptured {
      display: none; width: 100%; height: 100%; object-fit: cover;
    }
    .camera-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      padding-bottom: 20px;
    }
    /* Altta sıralanan galeri şeridi */
    .gallery-strip {
      display: flex;
      gap: 8px;
      width: 100%;
      overflow-x: auto;
      padding: 5px 0;
    }
    .gallery-strip::-webkit-scrollbar { height: 4px; }
    .gallery-strip::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 4px; }
    .gallery-thumb {
      width: 65px; height: 65px;
      border-radius: 8px;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid transparent;
      flex-shrink: 0;
      transition: border-color 0.2s;
    }
    .gallery-thumb:hover { border-color: #38bdf8; }

    .capture-row {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
    }
    .shutter-btn {
      width: 70px; height: 70px;
      background: white;
      border: 4px solid rgba(56, 189, 248, 0.8);
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .shutter-btn:active { transform: scale(0.9); }
    
    .gallery-upload-label {
      background: rgba(255, 255, 255, 0.2);
      padding: 10px 15px;
      border-radius: 10px;
      color: white;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .gallery-upload-label input { display: none; }

    /* Alt Navigasyon Barı */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 1000;
    }
    .nav-item {
      background: none; border: none; color: #94a3b8; font-size: 13px; font-weight: 600; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 4px; transition: color 0.3s;
    }
    .nav-item i { font-size: 18px; }
    .nav-item.active { color: #38bdf8; }

    .profile-section { display: none; }
    .profile-box {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px;
    }
    .profile-big-avatar {
      width: 60px; height: 60px; background: linear-gradient(135deg, #38bdf8, #6366f1);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: bold; color: white; margin: 0 auto 10px auto;
    }
    .profile-box h3 { font-size: 18px; color: #fff; margin-bottom: 4px; }
    .profile-box p { color: #94a3b8; font-size: 13px; }

    @media (max-width: 480px) {
      body { padding: 8px; }
      .container { padding: 20px 14px; border-radius: 16px; }
    }
  </style>
</head>
<body>

  <!-- KİMLİK DOĞRULAMA (Giriş / Kayıt) -->
  <div id="auth-container" class="container">
    
    <!-- GİRİŞ FORMU -->
    <div id="login-section">
      <div class="brand-header">
        <h1>Fetih Sosyal</h1>
        <p>Hesabına giriş yap ve akışa katıl</p>
      </div>

      <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input type="text" id="login-identifier" placeholder="E-posta, Tel veya Kullanıcı Adı">
      </div>

      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="login-password" placeholder="Fetih Sosyal Şifren">
      </div>

      <button id="login-btn" class="btn">Giriş Yap</button>

      <p class="toggle-text">Hesabın yok mu? <span id="goto-register">Kayıt Ol</span></p>
    </div>

    <!-- KAYIT FORMU -->
    <div id="register-section" style="display: none;">
      <div class="brand-header">
        <h1>Fetih Sosyal</h1>
        <p>Aramıza katılmak için formu doldur</p>
      </div>

      <div class="input-group">
        <i class="fa-solid fa-id-card"></i>
        <input type="text" id="reg-name" placeholder="Ad Soyad">
      </div>

      <div class="input-group">
        <i class="fa-solid fa-at"></i>
        <input type="text" id="reg-username" placeholder="Kullanıcı Adı (Boşluksuz)" oninput="this.value = this.value.replace(/\s/g, '').toLowerCase()">
      </div>

      <div class="input-group">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" id="reg-email" placeholder="E-posta Adresi">
      </div>

      <div class="input-group">
        <i class="fa-solid fa-phone"></i>
        <input type="text" id="reg-phone" placeholder="Telefon Numarası (Boşluksuz)" oninput="this.value = this.value.replace(/\s/g, '')">
      </div>

      <div class="input-group">
        <i class="fa-solid fa-key"></i>
        <input type="password" id="reg-password" placeholder="Şifre Oluştur">
      </div>

      <button id="register-btn" class="btn">Kayıt Ol</button>

      <p class="toggle-text">Zaten hesabın var mı? <span id="goto-login">Giriş Yap</span></p>
    </div>

  </div>

  <!-- ANA AKIŞ VE PROFİL EKRANI -->
  <div id="feed-container" class="container feed-container" style="display: none;" id="swipeArea">
    
    <!-- AKIŞ SEKMESİ -->
    <div id="tab-feed">
      <div class="feed-header">
        <h2>Fetih Sosyal</h2>
        <button id="logout-btn" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Çıkış</button>
      </div>
      
      <div class="input-group">
        <textarea id="postContent" placeholder="Ne düşünüyorsun? (Sağa kaydırarak kamera açabilirsin ➔)"></textarea>
      </div>

      <!-- Kamera Açma Butonu -->
      <button class="btn" id="openCameraBtn" style="background: rgba(56, 189, 248, 0.2); border: 1px solid #38bdf8; margin-bottom: 14px;">
        <i class="fa-solid fa-camera"></i> Kamera / Galeri Aç (Insta Tarzı)
      </button>

      <!-- Seçilen Medya Önizleme -->
      <div id="previewContainer" style="display:none; text-align:center; margin-bottom:14px;">
        <img id="previewImg" src="" alt="Önizleme" style="max-width:100%; max-height:150px; border-radius:10px; object-fit:cover;">
        <br>
        <button class="remove-media" id="removeMediaBtn" style="background:#ef4444; color:white; border:none; padding:4px 8px; font-size:11px; border-radius:6px; cursor:pointer; margin-top:6px;">Medyayı Kaldır</button>
      </div>

      <button id="sendBtn" class="btn"><i class="fa-solid fa-paper-plane"></i> Paylaş</button>

      <div id="feed">
        <div id="postsList"></div>
      </div>
    </div>

    <!-- PROFİL SEKMESİ -->
    <div id="tab-profile" class="profile-section">
      <div class="feed-header">
        <h2>Profilim</h2>
        <button id="profile-logout-btn" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Çıkış</button>
      </div>

      <div class="profile-box">
        <div class="profile-big-avatar" id="profileAvatarLetter">U</div>
        <h3 id="profileUsernameDisplay">@kullanici</h3>
        <p>Fetih Sosyal Üyesi</p>
      </div>

      <h3 style="font-size: 15px; color: #38bdf8; margin-bottom: 10px;"><i class="fa-solid fa-address-card"></i> Paylaşımlarım</h3>
      <div id="myPostsList"></div>
    </div>

    <!-- ALT NAVİGASYON (TAB BAR) -->
    <div class="bottom-nav">
      <button class="nav-item active" id="nav-feed-btn" onclick="switchTab('feed')">
        <i class="fa-solid fa-house"></i>
        <span>Akış</span>
      </button>
      <button class="nav-item" id="nav-profile-btn" onclick="switchTab('profile')">
        <i class="fa-solid fa-user"></i>
        <span>Profilim</span>
      </button>
    </div>

  </div>

  <!-- INSTA TARZI KAMERA MODALI -->
  <div id="camera-modal">
    <div class="camera-top-bar">
      <span>Kamera & Galeri</span>
      <button id="closeCameraModal"><i class="fa-solid fa-xmark"></i></button>
    </div>
    
    <div class="camera-viewport">
      <video id="cameraStream" autoplay playsinline></video>
      <img id="previewImageCaptured" alt="Çekilen Fotoğraf">
      <canvas id="snapshotCanvas" style="display:none;"></canvas>
    </div>

    <div class="camera-controls">
      <!-- Altta Sıralanan Fotoğraflar Şeridi -->
      <div class="gallery-strip" id="galleryStrip">
        <!-- Tarayıcıdan seçilen son fotoğraflar buraya otomatik eklenecek -->
      </div>

      <div class="capture-row">
        <label class="gallery-upload-label">
          <i class="fa-solid fa-folder-open"></i> Dosya Seç
          <input type="file" id="modalFileInput" accept="image/*,video/*" multiple>
        </label>
        
        <button class="shutter-btn" id="shutterBtn" title="Fotoğraf Çek"></button>
        
        <button class="btn" id="useCapturedBtn" style="width: auto; padding: 10px 20px; display: none;">Kullan ✓</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  
  <script>
    const socket = io();

    const loginSection = document.getElementById('login-section');
    const registerSection = document.getElementById('register-section');
    const authContainer = document.getElementById('auth-container');
    const feedContainer = document.getElementById('feed-container');

    let selectedMediaBase64 = null;
    let mediaStream = null;

    document.getElementById('goto-register').onclick = () => {
      loginSection.style.display = 'none';
      registerSection.style.display = 'block';
    };

    document.getElementById('goto-login').onclick = () => {
      registerSection.style.display = 'none';
      loginSection.style.display = 'block';
    };

    // --- INSTA TARZI SAĞA KAYDIRMA (SWIPE) VE BUTON İLE KAMERA AÇMA ---
    const openCameraModal = async () => {
      const modal = document.getElementById('camera-modal');
      modal.style.display = 'flex';
      
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        const videoElem = document.getElementById('cameraStream');
        videoElem.srcObject = mediaStream;
        videoElem.style.display = 'block';
        document.getElementById('previewImageCaptured').style.display = 'none';
        document.getElementById('useCapturedBtn').style.display = 'none';
      } catch (err) {
        console.warn("Kamera izni alınamadı veya desteklenmiyor:", err);
      }
    };

    document.getElementById('openCameraBtn').onclick = openCameraModal;

    // Sağa Kaydırma Hareketi (Swipe Right) Algılama
    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    });

    document.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    });

    function handleSwipe() {
      // Eğer sağa doğru kaydırıldıysa ve akış ekranındaysak kamerayı aç
      if (touchEndX - touchStartX > 100 && feedContainer.style.display !== 'none') {
        openCameraModal();
      }
    }

    // Kamerayı Kapat
    document.getElementById('closeCameraModal').onclick = () => {
      const modal = document.getElementById('camera-modal');
      modal.style.display = 'none';
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
    };

    // Fotoğraf Çek (Shutter)
    document.getElementById('shutterBtn').onclick = () => {
      const video = document.getElementById('cameraStream');
      const canvas = document.getElementById('snapshotCanvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      selectedMediaBase64 = canvas.toDataURL('image/jpeg', 0.8);
      
      // Önizlemeye yansıt
      const previewImg = document.getElementById('previewImageCaptured');
      previewImg.src = selectedMediaBase64;
      previewImg.style.display = 'block';
      video.style.display = 'none';
      document.getElementById('useCapturedBtn').style.display = 'block';
    };

    // Çekilen veya Seçilen Medyayı Onayla
    document.getElementById('useCapturedBtn').onclick = () => {
      if (selectedMediaBase64) {
        showMainPreview(selectedMediaBase64);
        document.getElementById('camera-modal').style.display = 'none';
        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
        }
      }
    };

    // Alt Galeri Şeridinden Dosya Seçme / Yükleme
    document.getElementById('modalFileInput').onchange = function(e) {
      const files = e.target.files;
      if (!files.length) return;

      const galleryStrip = document.getElementById('galleryStrip');

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const reader = new FileReader();

        reader.onload = function(uploadEvent) {
          const res = uploadEvent.target.result;

          // Galeri şeridine küçük resim ekle
          const thumb = document.createElement('img');
          thumb.src = res;
          thumb.className = 'gallery-thumb';
          thumb.onclick = () => {
            selectedMediaBase64 = res;
            showMainPreview(res);
            document.getElementById('camera-modal').style.display = 'none';
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
          };
          galleryStrip.prepend(thumb);

          // İlk seçileni otomatik seç
          if (i === 0) {
            selectedMediaBase64 = res;
          }
        };
        reader.readAsDataURL(file);
      }
    };

    function showMainPreview(src) {
      const container = document.getElementById('previewContainer');
      const img = document.getElementById('previewImg');
      img.src = src;
      container.style.display = 'block';
    }

    document.getElementById('removeMediaBtn').onclick = () => {
      selectedMediaBase64 = null;
      document.getElementById('previewContainer').style.display = 'none';
    };

    // Sekme Değiştirme
    window.switchTab = function(tabName) {
      const feedTab = document.getElementById('tab-feed');
      const profileTab = document.getElementById('tab-profile');
      const navFeed = document.getElementById('nav-feed-btn');
      const navProfile = document.getElementById('nav-profile-btn');

      if (tabName === 'feed') {
        feedTab.style.display = 'block';
        profileTab.style.display = 'none';
        navFeed.classList.add('active');
        navProfile.classList.remove('active');
      } else {
        feedTab.style.display = 'none';
        profileTab.style.display = 'block';
        navProfile.classList.add('active');
        navFeed.classList.remove('active');
        loadMyProfile();
      }
    };

    document.getElementById('register-btn').onclick = async () => {
      const name = document.getElementById('reg-name').value.trim();
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;

      if (!name || !username || !email || !password) {
        return alert("Lütfen zorunlu alanları doldurun!");
      }

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, username, email, phone, password })
        });
        const data = await res.json();
        if (data.success) {
          alert(data.message);
          registerSection.style.display = 'none';
          loginSection.style.display = 'block';
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert("Kayıt sırasında bağlantı hatası oluştu!");
      }
    };

    document.getElementById('login-btn').onclick = async () => {
      const identifier = document.getElementById('login-identifier').value.trim();
      const password = document.getElementById('login-password').value;

      if (!identifier || !password) {
        return alert("Bilgileri girin!");
      }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('fetih_username', data.username);
          showFeed();
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert("Giriş hatası!");
      }
    };

    function handleLogout() {
      localStorage.removeItem('fetih_username');
      authContainer.style.display = 'block';
      feedContainer.style.display = 'none';
    }

    document.getElementById('logout-btn').onclick = handleLogout;
    document.getElementById('profile-logout-btn').onclick = handleLogout;

    let allPostsCache = {};

    function showFeed() {
      authContainer.style.display = 'none';
      feedContainer.style.display = 'block';
      loadPosts();
    }

    async function loadPosts() {
      try {
        const res = await fetch('https://fetih-social-f6505-default-rtdb.firebaseio.com/posts.json');
        const data = await res.json();
        allPostsCache = data || {};
        
        const postsList = document.getElementById('postsList');
        postsList.innerHTML = '';
        
        if (allPostsCache) {
          Object.keys(allPostsCache).reverse().forEach(key => {
            addPostToUI(allPostsCache[key], postsList);
          });
        }
      } catch (err) {
        console.error(err);
      }
    }

    function loadMyProfile() {
      const currentUsername = localStorage.getItem('fetih_username') || '';
      document.getElementById('profileUsernameDisplay').innerText = '@' + currentUsername;
      document.getElementById('profileAvatarLetter').innerText = currentUsername ? currentUsername[0].toUpperCase() : 'U';

      const myPostsList = document.getElementById('myPostsList');
      myPostsList.innerHTML = '';

      let hasPost = false;
      if (allPostsCache) {
        Object.keys(allPostsCache).reverse().forEach(key => {
          const post = allPostsCache[key];
          if (post.username === currentUsername) {
            hasPost = true;
            addPostToUI(post, myPostsList);
          }
        });
      }

      if (!hasPost) {
        myPostsList.innerHTML = '<p style="text-align: center; color: #94a3b8; font-size: 13px; margin-top: 15px;">Henüz bir paylaşımın yok.</p>';
      }
    }

    function addPostToUI(post, targetContainer) {
      const div = document.createElement('div');
      div.className = 'post-card';
      
      let mediaHTML = '';
      if (post.mediaData) {
        if (post.mediaData.startsWith('data:video')) {
          mediaHTML = `<video src="${post.mediaData}" controls class="post-video"></video>`;
        } else {
          mediaHTML = `<img src="${post.mediaData}" class="post-media" alt="Medya">`;
        }
      }

      div.innerHTML = `
        <div class="post-header">
          <div class="user-avatar">${post.username ? post.username[0].toUpperCase() : 'U'}</div>
          <strong>@${post.username}</strong>
        </div>
        <p>${post.content}</p>
        ${mediaHTML}
        <span class="post-time">${new Date(post.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
      `;
      targetContainer.appendChild(div);
    }

    document.getElementById('sendBtn').onclick = () => {
      const content = document.getElementById('postContent').value.trim();
      if (!content && !selectedMediaBase64) return;

      socket.emit('new_post', {
        username: localStorage.getItem('fetih_username'),
        content,
        mediaData: selectedMediaBase64,
        timestamp: Date.now()
      });

      document.getElementById('postContent').value = '';
      document.getElementById('previewContainer').style.display = 'none';
      selectedMediaBase64 = null;
    };

    socket.on('receive_post', (post) => {
      const fakeKey = 'post_' + Date.now();
      allPostsCache[fakeKey] = post;

      const postsList = document.getElementById('postsList');
      if (postsList) {
        const div = document.createElement('div');
        div.className = 'post-card';
        let mediaHTML = '';
        if (post.mediaData) {
          if (post.mediaData.startsWith('data:video')) {
            mediaHTML = `<video src="${post.mediaData}" controls class="post-video"></video>`;
          } else {
            mediaHTML = `<img src="${post.mediaData}" class="post-media" alt="Medya">`;
          }
        }
        div.innerHTML = `
          <div class="post-header">
            <div class="user-avatar">${post.username ? post.username[0].toUpperCase() : 'U'}</div>
            <strong>@${post.username}</strong>
          </div>
          <p>${post.content}</p>
          ${mediaHTML}
          <span class="post-time">${new Date(post.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
        `;
        postsList.prepend(div);
      }
    });

    if (localStorage.getItem('fetih_username')) {
      showFeed();
    }
  </script>
</body>
</html>
