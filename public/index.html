<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fetih Sosyal</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    html, body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%) fixed;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
    }
    
    .container { 
      width: 100%; 
      max-width: 480px; 
      background: rgba(30, 41, 59, 0.85); 
      backdrop-filter: blur(16px); 
      -webkit-backdrop-filter: blur(16px); 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      border-radius: 20px; 
      padding: 30px 20px; 
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); 
      margin-bottom: 30px;
    }

    .brand-header { text-align: center; margin-bottom: 24px; }
    .brand-header h1 { font-size: 28px; font-weight: 700; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
    .brand-header p { color: #94a3b8; font-size: 13px; }

    .input-group { position: relative; margin-bottom: 14px; width: 100%; }
    .input-group i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 15px; }
    .input-group input, .input-group textarea { width: 100%; padding: 12px 14px 12px 46px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #fff; font-size: 14px; outline: none; transition: all 0.3s ease; }
    .input-group textarea { padding-left: 14px; resize: none; height: 80px; }
    .input-group input:focus, .input-group textarea:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }

    .post-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .single-file-btn {
      width: 100%;
      padding: 12px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px dashed rgba(56, 189, 248, 0.4);
      border-radius: 12px;
      color: #38bdf8;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.3s;
    }

    .single-file-btn:hover { background: rgba(56, 189, 248, 0.1); }
    .single-file-btn input { display: none; }

    #previewContainer {
      display: none;
      position: relative;
      margin-bottom: 14px;
      text-align: center;
    }
    #previewImg {
      max-width: 100%;
      max-height: 150px;
      border-radius: 10px;
      object-fit: cover;
    }
    .remove-media {
      background: rgba(239, 68, 68, 0.8);
      color: white;
      border: none;
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%); border: none; border-radius: 12px; color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; margin-top: 6px; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3); }

    .toggle-text { text-align: center; margin-top: 20px; font-size: 13px; color: #94a3b8; }
    .toggle-text span { color: #38bdf8; font-weight: 600; cursor: pointer; }
    .toggle-text span:hover { text-decoration: underline; }

    /* Akış ve Profil Sekmeleri */
    .feed-container { max-width: 540px; width: 100%; padding: 20px 16px 80px 16px; }
    .feed-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .logout-btn { width: auto; padding: 6px 12px; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #f87171; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
    
    .post-card { background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; padding: 14px; margin-top: 14px; }
    .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .user-avatar { width: 34px; height: 34px; background: #6366f1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
    .post-card strong { color: #38bdf8; font-size: 14px; }
    .post-card p { color: #e2e8f0; font-size: 13px; line-height: 1.4; word-break: break-word; margin-bottom: 8px; }
    .post-media { width: 100%; border-radius: 10px; max-height: 300px; object-fit: cover; margin-top: 6px; }
    .post-video { width: 100%; border-radius: 10px; max-height: 300px; margin-top: 6px; outline: none; }
    .post-time { color: #64748b; font-size: 10px; margin-top: 6px; display: block; text-align: right; }

    /* Alt Navigasyon Barı */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 1000;
    }

    .nav-item {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: color 0.3s;
    }

    .nav-item i { font-size: 18px; }
    .nav-item.active { color: #38bdf8; }

    /* Profil Sayfası Alanı */
    .profile-section { display: none; }
    .profile-box {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }
    .profile-big-avatar {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      color: white;
      margin: 0 auto 10px auto;
    }
    .profile-box h3 { font-size: 18px; color: #fff; margin-bottom: 4px; }
    .profile-box p { color: #94a3b8; font-size: 13px; }

    @media (max-width: 480px) {
      body { padding: 8px; }
      .container { padding: 20px 14px; border-radius: 16px; }
    }
  </style>
</head>
<body>

  <!-- KİMLİK DOĞRULAMA (Giriş / Kayıt) -->
  <div id="auth-container" class="container">
    
    <!-- GİRİŞ FORMU -->
    <div id="login-section">
      <div class="brand-header">
        <h1>Fetih Sosyal</h1>
        <p>Hesabına giriş yap ve akışa katıl</p>
      </div>

      <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input type="text" id="login-identifier" placeholder="E-posta, Tel veya Kullanıcı Adı">
      </div>

      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="login-password" placeholder="Fetih Sosyal Şifren">
      </div>

      <button id="login-btn" class="btn">Giriş Yap</button>

      <p class="toggle-text">Hesabın yok mu? <span id="goto-register">Kayıt Ol</span></p>
    </div>

    <!-- KAYIT FORMU -->
    <div id="register-section" style="display: none;">
      <div class="brand-header">
        <h1>Fetih Sosyal</h1>
        <p>Aramıza katılmak için formu doldur</p>
      </div>

      <div class="input-group">
        <i class="fa-solid fa-id-card"></i>
        <input type="text" id="reg-name" placeholder="Ad Soyad">
      </div>

      <div class="input-group">
        <i class="fa-solid fa-at"></i>
        <input type="text" id="reg-username" placeholder="Kullanıcı Adı (Boşluksuz)" oninput="this.value = this.value.replace(/\s/g, '').toLowerCase()">
      </div>

      <div class="input-group">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" id="reg-email" placeholder="E-posta Adresi">
      </div>

      <div class="input-group">
        <i class="fa-solid fa-phone"></i>
        <input type="text" id="reg-phone" placeholder="Telefon Numarası (Boşluksuz)" oninput="this.value = this.value.replace(/\s/g, '')">
      </div>

      <div class="input-group">
        <i class="fa-solid fa-key"></i>
        <input type="password" id="reg-password" placeholder="Şifre Oluştur">
      </div>

      <button id="register-btn" class="btn">Kayıt Ol</button>

      <p class="toggle-text">Zaten hesabın var mı? <span id="goto-login">Giriş Yap</span></p>
    </div>

  </div>

  <!-- ANA AKIŞ VE PROFİL EKRANI -->
  <div id="feed-container" class="container feed-container" style="display: none;">
    
    <!-- AKIŞ SEKMESİ -->
    <div id="tab-feed">
      <div class="feed-header">
        <h2>Fetih Sosyal</h2>
        <button id="logout-btn" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Çıkış</button>
      </div>
      
      <div class="input-group">
        <textarea id="postContent" placeholder="Ne düşünüyorsun?"></textarea>
      </div>

      <div class="post-actions">
        <label class="single-file-btn">
          <i class="fa-solid fa-camera-retro"></i> <span id="fileBtnText">Fotoğraf / Video Seç</span>
          <input type="file" id="universalMediaInput" accept="image/*,video/*">
        </label>
      </div>

      <div id="previewContainer">
        <img id="previewImg" src="" alt="Önizleme">
        <br>
        <button class="remove-media" id="removeMediaBtn">Medyayı Kaldır</button>
      </div>

      <button id="sendBtn" class="btn"><i class="fa-solid fa-paper-plane"></i> Paylaş</button>

      <div id="feed">
        <div id="postsList"></div>
      </div>
    </div>

    <!-- PROFİL SEKMESİ -->
    <div id="tab-profile" class="profile-section">
      <div class="feed-header">
        <h2>Profilim</h2>
        <button id="profile-logout-btn" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Çıkış</button>
      </div>

      <div class="profile-box">
        <div class="profile-big-avatar" id="profileAvatarLetter">U</div>
        <h3 id="profileUsernameDisplay">@kullanici</h3>
        <p>Fetih Sosyal Üyesi</p>
      </div>

      <h3 style="font-size: 15px; color: #38bdf8; margin-bottom: 10px;"><i class="fa-solid fa-address-card"></i> Paylaşımlarım</h3>
      <div id="myPostsList"></div>
    </div>

    <!-- ALT NAVİGASYON (TAB BAR) -->
    <div class="bottom-nav">
      <button class="nav-item active" id="nav-feed-btn" onclick="switchTab('feed')">
        <i class="fa-solid fa-house"></i>
        <span>Akış</span>
      </button>
      <button class="nav-item" id="nav-profile-btn" onclick="switchTab('profile')">
        <i class="fa-solid fa-user"></i>
        <span>Profilim</span>
      </button>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  
  <script>
    const socket = io();

    const loginSection = document.getElementById('login-section');
    const registerSection = document.getElementById('register-section');
    const authContainer = document.getElementById('auth-container');
    const feedContainer = document.getElementById('feed-container');

    let selectedMediaBase64 = null;
    let allPostsCache = {};

    document.getElementById('goto-register').onclick = () => {
      loginSection.style.display = 'none';
      registerSection.style.display = 'block';
    };

    document.getElementById('goto-login').onclick = () => {
      registerSection.style.display = 'none';
      loginSection.style.display = 'block';
    };

    // Sekme Değiştirme (Akış / Profil)
    window.switchTab = function(tabName) {
      const feedTab = document.getElementById('tab-feed');
      const profileTab = document.getElementById('tab-profile');
      const navFeed = document.getElementById('nav-feed-btn');
      const navProfile = document.getElementById('nav-profile-btn');

      if (tabName === 'feed') {
        feedTab.style.display = 'block';
        profileTab.style.display = 'none';
        navFeed.classList.add('active');
        navProfile.classList.remove('active');
      } else {
        feedTab.style.display = 'none';
        profileTab.style.display = 'block';
        navProfile.classList.add('active');
        navFeed.classList.remove('active');
        loadMyProfile();
      }
    };

    // Medya Seçimi
    document.getElementById('universalMediaInput').onchange = function(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (file.size > 15 * 1024 * 1024) {
        alert("Seçilen dosya çok büyük (Maksimum 15MB olmalı)!");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(uploadEvent) {
        const result = uploadEvent.target.result;
        
        if (file.type.startsWith('image/')) {
          const img = new Image();
          img.src = result;
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800;
            const MAX_HEIGHT = 800;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            } else {
              if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            selectedMediaBase64 = canvas.toDataURL('image/jpeg', 0.7);
            showPreview(selectedMediaBase64);
          };
        } else {
          selectedMediaBase64 = result;
          showPreview(result);
        }

        document.getElementById('fileBtnText').innerText = "Dosya Seçildi ✓";
      };
      reader.readAsDataURL(file);
    };

    function showPreview(src) {
      const container = document.getElementById('previewContainer');
      const img = document.getElementById('previewImg');
      if (src.startsWith('data:video')) {
        img.style.display = 'none';
      } else {
        img.style.display = 'inline-block';
        img.src = src;
      }
      container.style.display = 'block';
    }

    document.getElementById('removeMediaBtn').onclick = () => {
      selectedMediaBase64 = null;
      document.getElementById('previewContainer').style.display = 'none';
      document.getElementById('fileBtnText').innerText = 'Fotoğraf / Video Seç';
      document.getElementById('universalMediaInput').value = '';
    };

    document.getElementById('register-btn').onclick = async () => {
      const name = document.getElementById('reg-name').value.trim();
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;

      if (!name || !username || !email || !password) {
        return alert("Lütfen zorunlu alanları doldurun!");
      }

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, username, email, phone, password })
        });
        const data = await res.json();
        if (data.success) {
          alert(data.message);
          registerSection.style.display = 'none';
          loginSection.style.display = 'block';
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert("Kayıt sırasında bağlantı hatası oluştu!");
      }
    };

    document.getElementById('login-btn').onclick = async () => {
      const identifier = document.getElementById('login-identifier').value.trim();
      const password = document.getElementById('login-password').value;

      if (!identifier || !password) {
        return alert("Bilgileri girin!");
      }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('fetih_username', data.username);
          showFeed();
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert("Giriş hatası!");
      }
    };

    function handleLogout() {
      localStorage.removeItem('fetih_username');
      authContainer.style.display = 'block';
      feedContainer.style.display = 'none';
    }

    document.getElementById('logout-btn').onclick = handleLogout;
    document.getElementById('profile-logout-btn').onclick = handleLogout;

    function showFeed() {
      authContainer.style.display = 'none';
      feedContainer.style.display = 'block';
      loadPosts();
    }

    async function loadPosts() {
      try {
        const res = await fetch('https://fetih-social-f6505-default-rtdb.firebaseio.com/posts.json');
        const data = await res.json();
        allPostsCache = data || {};
        
        const postsList = document.getElementById('postsList');
        postsList.innerHTML = '';
        
        if (allPostsCache) {
          Object.keys(allPostsCache).reverse().forEach(key => {
            addPostToUI(allPostsCache[key], postsList);
          });
        }
      } catch (err) {
        console.error(err);
      }
    }

    function loadMyProfile() {
      const currentUsername = localStorage.getItem('fetih_username') || '';
      document.getElementById('profileUsernameDisplay').innerText = '@' + currentUsername;
      document.getElementById('profileAvatarLetter').innerText = currentUsername ? currentUsername[0].toUpperCase() : 'U';

      const myPostsList = document.getElementById('myPostsList');
      myPostsList.innerHTML = '';

      let hasPost = false;
      if (allPostsCache) {
        Object.keys(allPostsCache).reverse().forEach(key => {
          const post = allPostsCache[key];
          if (post.username === currentUsername) {
            hasPost = true;
            addPostToUI(post, myPostsList);
          }
        });
      }

      if (!hasPost) {
        myPostsList.innerHTML = '<p style="text-align: center; color: #94a3b8; font-size: 13px; margin-top: 15px;">Henüz bir paylaşımın yok.</p>';
      }
    }

    function addPostToUI(post, targetContainer) {
      const div = document.createElement('div');
      div.className = 'post-card';
      
      let mediaHTML = '';
      if (post.mediaData) {
        if (post.mediaData.startsWith('data:video')) {
          mediaHTML = `<video src="${post.mediaData}" controls class="post-video"></video>`;
        } else {
          mediaHTML = `<img src="${post.mediaData}" class="post-media" alt="Medya">`;
        }
      }

      div.innerHTML = `
        <div class="post-header">
          <div class="user-avatar">${post.username ? post.username[0].toUpperCase() : 'U'}</div>
          <strong>@${post.username}</strong>
        </div>
        <p>${post.content}</p>
        ${mediaHTML}
        <span class="post-time">${new Date(post.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
      `;
      targetContainer.appendChild(div);
    }

    document.getElementById('sendBtn').onclick = () => {
      const content = document.getElementById('postContent').value.trim();
      if (!content && !selectedMediaBase64) return;

      socket.emit('new_post', {
        username: localStorage.getItem('fetih_username'),
        content,
        mediaData: selectedMediaBase64,
        timestamp: Date.now()
      });

      document.getElementById('postContent').value = '';
      document.getElementById('previewContainer').style.display = 'none';
      document.getElementById('fileBtnText').innerText = 'Fotoğraf / Video Seç';
      selectedMediaBase64 = null;
      document.getElementById('universalMediaInput').value = '';
    };

    socket.on('receive_post', (post) => {
      // Önbelleğe ekle
      const fakeKey = 'post_' + Date.now();
      allPostsCache[fakeKey] = post;

      const postsList = document.getElementById('postsList');
      if (postsList) {
        const div = document.createElement('div');
        div.className = 'post-card';
        let mediaHTML = '';
        if (post.mediaData) {
          if (post.mediaData.startsWith('data:video')) {
            mediaHTML = `<video src="${post.mediaData}" controls class="post-video"></video>`;
          } else {
            mediaHTML = `<img src="${post.mediaData}" class="post-media" alt="Medya">`;
          }
        }
        div.innerHTML = `
          <div class="post-header">
            <div class="user-avatar">${post.username ? post.username[0].toUpperCase() : 'U'}</div>
            <strong>@${post.username}</strong>
          </div>
          <p>${post.content}</p>
          ${mediaHTML}
          <span class="post-time">${new Date(post.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
        `;
        postsList.prepend(div);
      }
    });

    if (localStorage.getItem('fetih_username')) {
      showFeed();
    }
  </script>
</body>
</html>
